dependencies:
  config:
  - "field.instance.node.article.body"
  - "field.instance.node.article.field_image"
  - "field.instance.node.article.field_tags"
  - "field.instance.node.article.comment"
data:
  entityTypeId: "node"
  bundle: "article"
  mode: "default"
  slots:
    field_image:
      fieldName: "field_image"
      handler: "image"
      weight: -1
      settings:
        image_style: "wide"
    body:
      fieldName: "body"
      handler: "text_default"
      weight: 0
      settings: {}
    field_tags:
      fieldName: "field_tags"
      handler: "entity_reference_label"
      weight: 10
      settings: {}
    comment:
      fieldName: "comment"
      handler: "comment_default"
      weight: 100
      settings: {}
  hiddenLabels:
  - "field_image"
  - "body"
  - "comment"
  disabled: []

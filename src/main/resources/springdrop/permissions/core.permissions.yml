administer site configuration:
  title: Administer site configuration
  description: Change how the site itself is set up, including its health endpoints.
  restricted: true
administer fields:
  title: Administer fields
  description: Add, change, and remove fields, and lay out forms and displays.
  restricted: true
administer permissions:
  title: Administer permissions
  description: Decide what each role may do, including roles more trusted than your own.
  restricted: true
administer users:
  title: Administer users
  description: Change what accounts may do, and close them.
  restricted: true
ban ip addresses:
  title: Ban IP addresses
  description: Refuse requests from an address before the site answers them.
  restricted: true
administer menu:
  title: Administer menus and menu links
  description: Add menus, and decide which links hang in them and in what order.
  restricted: true
administer blocks:
  title: Administer blocks
  description: Place blocks in the regions of each theme, and write the custom blocks in the library.
  restricted: true
configure layout overrides:
  title: Configure layout overrides
  description: Give a piece of content you may edit a layout of its own, where its view mode allows one.
administer workflows:
  title: Administer workflows
  description: Add workflows, and decide the states content moves through and the transitions between them.
  restricted: true

administer site configuration:
  title: Administer site configuration
  description: Change how the site itself is set up, including its health endpoints.
  restricted: true
administer fields:
  title: Administer fields
  description: Add, change, and remove fields, and lay out forms and displays.
  restricted: true
administer permissions:
  title: Administer permissions
  description: Decide what each role may do, including roles more trusted than your own.
  restricted: true
administer users:
  title: Administer users
  description: Change what accounts may do, and close them.
  restricted: true
ban ip addresses:
  title: Ban IP addresses
  description: Refuse requests from an address before the site answers them.
  restricted: true
administer menu:
  title: Administer menus and menu links
  description: Add menus, and decide which links hang in them and in what order.
  restricted: true
administer blocks:
  title: Administer blocks
  description: Place blocks in the regions of each theme, and write the custom blocks in the library.
  restricted: true
configure layout overrides:
  title: Configure layout overrides
  description: Give a piece of content you may edit a layout of its own, where its view mode allows one.
administer workflows:
  title: Administer workflows
  description: Add workflows, and decide the states content moves through and the transitions between them.
  restricted: true
access site reports:
  title: View site reports
  description: Read the activity log and the status report.
  restricted: true
administer languages:
  title: Administer languages
  description: Add the languages the site is shown in, and decide how a request's language is chosen.
  restricted: true
translate interface:
  title: Translate the interface
  description: Translate the words the site's pages are built from, and import and export translation files.
  restricted: true
translate content:
  title: Translate content
  description: Add, edit, and delete the translations of content you may edit.
translate configuration:
  title: Translate configuration
  description: Translate the names, help, and titles of fields, content types, views, menus, and other configuration.
  restricted: true
administer rest resources:
  title: Administer REST resources
  description: Choose which content is served over REST, by which methods, and in which formats.
  restricted: true

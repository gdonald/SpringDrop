<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | ' + ${siteName}">SpringDrop</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    /* Administration lists many rows at once, so tables run tighter here than on
       the front end. This is what Bootstrap's .table-sm does, applied to every
       table under the admin layout rather than per table. */
    .admin-page .table > :not(caption) > * > * {
      padding: 0.25rem 0.25rem;
    }
  </style>
</head>
<body class="admin-page">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark" id="admin-toolbar">
  <div class="container-fluid">
    <a class="navbar-brand" href="/" th:text="${siteName}">SpringDrop</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#admin-toolbar-menu" aria-controls="admin-toolbar-menu"
            aria-expanded="false" aria-label="Toggle administration menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="admin-toolbar-menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item" th:each="link : ${primaryNavigation}">
          <a class="nav-link" th:href="${link.url}" th:text="${link.label}">Content</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container-fluid py-3">
  <div th:replace="${partials['breadcrumb']}"></div>

  <div class="row">
    <div class="col-12">
      <header class="mb-3">
        <h1 class="h4 mb-1" th:text="${title}">Title</h1>
        <p class="text-body-secondary mb-0" th:if="${!slogan.isEmpty()}" th:text="${slogan}">Slogan</p>
      </header>

      <div th:replace="${partials['tabs']}"></div>
      <div th:replace="${partials['local-actions']}"></div>
      <div th:replace="${partials['messages']}"></div>

      <div th:utext="${children}">content</div>

      <div th:replace="${partials['pager']}"></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

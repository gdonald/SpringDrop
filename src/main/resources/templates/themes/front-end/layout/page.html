<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | ' + ${siteName}">SpringDrop</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<th:block th:utext="${slots['header']}"></th:block>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container">
    <a class="navbar-brand" href="/" th:text="${siteName}">SpringDrop</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#primary-navigation" aria-controls="primary-navigation"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="primary-navigation">
      <div th:replace="${partials['menu']}"></div>
      <th:block th:utext="${slots['primary_menu']}"></th:block>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div th:replace="${partials['breadcrumb']}"></div>
  <th:block th:utext="${slots['breadcrumb']}"></th:block>
  <th:block th:utext="${slots['highlighted']}"></th:block>

  <div class="row">
    <div class="col-12 col-lg-8">
      <header class="mb-3">
        <h1 class="h3 mb-1" th:text="${title}">Title</h1>
        <p class="text-body-secondary mb-0" th:if="${!slogan.isEmpty()}" th:text="${slogan}">Slogan</p>
      </header>

      <div th:replace="${partials['tabs']}"></div>
      <div th:replace="${partials['local-actions']}"></div>
      <div th:replace="${partials['messages']}"></div>
      <th:block th:utext="${slots['help']}"></th:block>

      <th:block th:utext="${slots['content']}"></th:block>
      <div th:utext="${children}">content</div>

      <div th:replace="${partials['pager']}"></div>
    </div>
    <aside class="col-12 col-lg-4" th:if="${slots['sidebar'] != null}" th:utext="${slots['sidebar']}"></aside>
  </div>
</main>

<footer class="container py-4 border-top">
  <th:block th:utext="${slots['footer']}"></th:block>
  <p class="text-body-secondary mb-0" th:text="${siteName}">SpringDrop</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

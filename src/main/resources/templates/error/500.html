<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <div class="row justify-content-center text-center">
    <div class="col-lg-6">
      <h1 class="display-6">500</h1>
      <p class="lead">Something went wrong.</p>
      <p class="error-message text-start" th:if="${errorMessage != null}" th:text="${errorMessage}">
        IllegalStateException: The cache is not ready.</p>
      <pre class="error-trace text-start small border rounded p-2" th:if="${errorTrace != null}"
           th:text="${errorTrace}">at dev.springdrop...</pre>
      <a href="/" class="btn btn-primary">Back to home</a>
    </div>
  </div>
</main>
</body>
</html>

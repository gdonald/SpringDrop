<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${bulletin.label}">Bulletin</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${bulletin.label}">Bulletin</h1>
  <div th:if="${@access.mayUpdate('bulletin', bulletin)}">
    <div th:replace="~{fragments/actions :: edit('/bulletin/' + ${bulletin.id} + '/edit')}"></div>
  </div>
</main>
</body>
</html>

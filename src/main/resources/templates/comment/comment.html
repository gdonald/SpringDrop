<article class="comment mb-3" th:id="'comment-' + ${id}" th:classappend="'ms-' + ${depth > 5 ? 5 : depth}"
         th:attr="data-comment=${id},data-depth=${depth}" xmlns:th="http://www.thymeleaf.org">
  <h3 class="h6 mb-1" th:text="${subject}">Subject</h3>
  <p class="text-body-secondary small mb-1">
    Submitted by <span class="comment__author" th:text="${author}">Anonymous</span>
    <span th:if="${!date.isEmpty()}" th:text="'on ' + ${date}">on Sat, Oct 3, 2026 - 09:00</span>
  </p>
  <p th:if="${!published}"><span class="badge text-bg-warning">Unapproved</span></p>
  <div class="comment__body mb-2" th:utext="${body}">Body</div>
  <div class="d-flex gap-2">
    <a class="btn btn-secondary btn-sm" th:if="${!replyUrl.isEmpty()}" th:href="${replyUrl}">Reply</a>
    <a class="btn btn-secondary btn-sm" th:if="${!editUrl.isEmpty()}" th:href="${editUrl}">Edit</a>
    <a class="btn btn-danger btn-sm" th:if="${!deleteUrl.isEmpty()}" th:href="${deleteUrl}">Delete</a>
  </div>
</article>

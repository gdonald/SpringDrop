<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Add content</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Add content</h1>

  <p class="text-body-secondary" th:if="${types.isEmpty()}">
    There is no content type you may create content of.
  </p>

  <div class="list-group" th:if="${!types.isEmpty()}">
    <a class="list-group-item list-group-item-action" th:each="type : ${types}"
       th:href="${addPath} + ${type.id}">
      <span class="fw-semibold" th:text="${type.label}">Article</span>
      <span class="d-block text-body-secondary" th:if="${!type.description.isEmpty()}"
            th:text="${type.description}">News and announcements.</span>
    </a>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Changes</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Changes</h1>
  <p class="text-body-secondary" th:text="${description}">Revision 1 compared with revision 2.</p>
  <p><a class="btn btn-secondary btn-sm" th:href="${historyPath}">Back to the revisions</a></p>

  <div class="table-responsive">
    <table class="table align-middle">
      <thead>
      <tr>
        <th scope="col">Part</th>
        <th scope="col">Changes</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${rows}" th:classappend="${row.changed} ? 'table-warning' : ''"
          th:attr="data-changed=${row.changed}">
        <th scope="row" th:text="${row.label}">Title</th>
        <td><th:block th:each="part : ${row.parts}"><del class="text-danger"
            th:if="${part.change.name() == 'REMOVED'}" th:text="${part.text}">old</del><ins class="text-success"
            th:if="${part.change.name() == 'ADDED'}" th:text="${part.text}">new</ins><span
            th:if="${part.change.name() == 'KEPT'}" th:text="${part.text}">kept</span> </th:block></td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Translations</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Translations of Spring schedule</h1>

  <div class="table-responsive">
    <table class="table align-middle translations">
      <thead>
      <tr>
        <th scope="col">Language</th>
        <th scope="col">Title</th>
        <th scope="col">Status</th>
        <th scope="col">Operations</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${rows}" th:attr="data-language=${row.language.id}">
        <td th:text="${row.language.label}">French</td>
        <td th:text="${row.title}">Horaires du printemps</td>
        <td th:text="${row.status}">Translated</td>
        <td class="d-flex gap-2">
          <a class="btn btn-secondary btn-sm" th:if="${row.translated}"
             th:href="${editPath} + ${row.language.id}">Edit</a>
          <form method="post" th:if="${!row.translated}" th:action="${addPath} + ${row.language.id}">
            <button type="submit" class="btn btn-primary btn-sm">Add</button>
          </form>
          <a class="btn btn-danger btn-sm" th:if="${row.translated && !row.original}"
             th:href="${deletePath} + ${row.language.id}">Delete</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

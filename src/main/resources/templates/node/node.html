<article class="node mb-4" th:classappend="'node--' + ${viewMode}"
         th:attr="data-node=${id},data-view-mode=${viewMode}" xmlns:th="http://www.thymeleaf.org">
  <h2 class="h4" th:if="${!page}"><a th:href="${url}" th:text="${label}">Title</a></h2>
  <p th:if="${!published}"><span class="badge text-bg-warning">Unpublished</span></p>
  <div class="node__content" th:utext="${children}">Content</div>
</article>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Revisions</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Revisions</h1>
  <p><a class="btn btn-secondary btn-sm" th:href="${nodePath}">Back to the content</a></p>

  <form method="get" th:action="${historyPath} + '/diff'">
    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
        <tr>
          <th scope="col">Revision</th>
          <th scope="col" th:if="${comparable}">Compare</th>
          <th scope="col">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row, position : ${rows}" th:attr="data-revision=${row.revisionId}">
          <td>
            <a th:href="${historyPath} + '/' + ${row.revisionId} + '/view'" th:text="${row.date}">10/03/2026 - 09:00</a>
            by <span th:text="${row.author}">editor</span>
            <p class="text-body-secondary mb-0" th:if="${!row.log.isEmpty()}" th:text="${row.log}">Fixed a typo.</p>
          </td>
          <td th:if="${comparable}">
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="left" th:value="${row.revisionId}"
                     th:id="'left-' + ${row.revisionId}" th:checked="${position.index == 1}" required>
              <label class="form-check-label" th:for="'left-' + ${row.revisionId}">From</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="right" th:value="${row.revisionId}"
                     th:id="'right-' + ${row.revisionId}" th:checked="${position.index == 0}" required>
              <label class="form-check-label" th:for="'right-' + ${row.revisionId}">To</label>
            </div>
          </td>
          <td>
            <span class="badge text-bg-success" th:if="${row.current}">Current revision</span>
            <a class="btn btn-secondary btn-sm" th:if="${row.revertible}"
               th:href="${historyPath} + '/' + ${row.revisionId} + '/revert'">Revert</a>
            <a class="btn btn-danger btn-sm" th:if="${row.deletable}"
               th:href="${historyPath} + '/' + ${row.revisionId} + '/delete'">Delete</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <button type="submit" class="btn btn-primary" th:if="${comparable}">Compare selected revisions</button>
  </form>
</main>
</body>
</html>

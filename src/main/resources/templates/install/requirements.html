<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title + ' | Install SpringDrop'}">Verify requirements | Install SpringDrop</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <div class="row">
    <div class="col-md-3">
      <ol class="list-group list-group-numbered install-steps mb-4">
        <li th:each="name, position : ${steps}" th:text="${name}"
            th:classappend="${position.index == step} ? 'active' : (${position.index < step} ? 'text-body-secondary' : '')"
            class="list-group-item">Verify requirements</li>
      </ol>
    </div>
    <div class="col-md-9">
      <h1 class="h3" th:text="${title}">Verify requirements</h1>
      <table class="table align-middle install-requirements">
        <tbody>
        <tr th:each="requirement : ${requirements}" th:classappend="${requirement.met} ? '' : 'table-danger'"
            th:attr="data-met=${requirement.met}">
          <th scope="row" th:text="${requirement.title}">Database</th>
          <td>
            <span th:text="${requirement.found}">PostgreSQL 17.2</span>
            <div class="small" th:unless="${requirement.met}" th:text="${requirement.help}">PostgreSQL 13 or later
              is needed.</div>
          </td>
        </tr>
        </tbody>
      </table>
      <a class="btn btn-primary" th:if="${met}" th:href="@{${next}}">Continue</a>
      <a class="btn btn-secondary" th:unless="${met}" th:href="@{${again}}">Check again</a>
    </div>
  </div>
</main>
</body>
</html>

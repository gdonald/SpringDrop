<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title + ' | Install SpringDrop'}">Choose language | Install SpringDrop</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <div class="row">
    <div class="col-md-3">
      <ol class="list-group list-group-numbered install-steps mb-4">
        <li th:each="name, position : ${steps}" th:text="${name}"
            th:classappend="${position.index == step} ? 'active' : (${position.index < step} ? 'text-body-secondary' : '')"
            class="list-group-item">Choose language</li>
      </ol>
    </div>
    <div class="col-md-9">
      <h1 class="h3" th:text="${title}">Choose language</h1>
      <form method="post" th:action="${action}" data-form-states>
        <div th:utext="${formMarkup}"></div>
      </form>
    </div>
  </div>
</main>
<script type="module" th:attr="nonce=${cspNonce}" th:inline="javascript">
  import { initFormStates } from [[${@assets.url('/js/form-states.js')}]];
  import { initFormValidation } from [[${@assets.url('/js/form-validation.js')}]];
  initFormStates();
  initFormValidation();
</script>
</body>
</html>

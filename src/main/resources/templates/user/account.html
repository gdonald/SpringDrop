<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Account</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <h1 class="h3" th:text="${title}">Account</h1>
      <p th:if="${message}" th:text="${message}"></p>
      <form th:if="${formMarkup}" method="post" th:action="${action}" data-form-states>
        <div th:utext="${formMarkup}"></div>
      </form>
    </div>
  </div>
</main>
<script type="module" th:attr="nonce=${cspNonce}">
  import { initFormValidation } from '/js/form-validation.js';
  initFormValidation();
</script>
</body>
</html>

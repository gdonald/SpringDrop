<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">API tokens</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">API tokens</h1>
  <p class="text-body-secondary">A token signs in to the REST and JSON:API endpoints as your account when a request
    sends it as <code>Authorization: Bearer &lt;token&gt;</code>.</p>

  <div class="alert alert-success" role="status" th:if="${issued != null}">
    <p class="mb-2">Copy the new token now. It is not shown again.</p>
    <code class="issued-token" th:text="${issued}">sd_token</code>
  </div>

  <form method="post" th:action="${action}" data-form-states>
    <div th:utext="${formMarkup}"></div>
  </form>

  <table class="table align-middle api-tokens" th:if="${!tokens.isEmpty()}">
    <thead>
    <tr>
      <th scope="col">Label</th>
      <th scope="col">Created</th>
      <th scope="col">Last used</th>
      <th scope="col">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="token : ${tokens}" th:attr="data-token-id=${token.id}">
      <td th:text="${token.label}">Deploy script</td>
      <td th:text="${token.created}">10/15/2026 - 09:00</td>
      <td th:text="${token.lastUsed}">Never</td>
      <td>
        <form method="post" th:action="@{/user/tokens/{id}/revoke(id=${token.id})}">
          <button type="submit" class="btn btn-danger btn-sm">Revoke</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
  <p th:if="${tokens.isEmpty()}">You have no API tokens.</p>
</main>
<script type="module" th:attr="nonce=${cspNonce}" th:inline="javascript">
  import { initFormStates } from [[${@assets.url('/js/form-states.js')}]];
  import { initFormValidation } from [[${@assets.url('/js/form-validation.js')}]];
  initFormStates();
  initFormValidation();
</script>
</body>
</html>

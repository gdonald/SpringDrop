<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Details</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Details</h1>

  <table class="table log-event">
    <tbody>
    <tr th:each="detail : ${details}">
      <th scope="row" th:text="${detail[0]}">Type</th>
      <td th:text="${detail[1]}">action</td>
    </tr>
    </tbody>
  </table>

  <a class="btn btn-secondary" th:href="${backPath}">Back to the log</a>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">REST resources</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">REST resources</h1>
  <p class="text-body-secondary">Each request also needs the method's permission and access to the entity.</p>
  <form method="post" th:action="${action}">
    <table class="table align-middle rest-resources">
      <thead>
      <tr>
        <th scope="col">Entity type</th>
        <th scope="col">Methods</th>
        <th scope="col">Formats</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${rows}" th:attr="data-entity-type=${row.entityType}">
        <td th:text="${row.entityType}">node</td>
        <td>
          <div class="form-check form-check-inline" th:each="method : ${methods}">
            <input class="form-check-input" type="checkbox" value="true"
                   th:id="${row.entityType + '__' + method}" th:name="${row.entityType + '__' + method}"
                   th:checked="${row.methods.contains(method)}">
            <label class="form-check-label" th:for="${row.entityType + '__' + method}" th:text="${method}">GET</label>
          </div>
        </td>
        <td>
          <div class="form-check form-check-inline" th:each="format : ${formats}">
            <input class="form-check-input" type="checkbox" value="true"
                   th:id="${row.entityType + '__' + format}" th:name="${row.entityType + '__' + format}"
                   th:checked="${row.formats.contains(format)}">
            <label class="form-check-label" th:for="${row.entityType + '__' + format}" th:text="${format}">json</label>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
    <button type="submit" class="btn btn-primary">Save configuration</button>
  </form>
</main>
</body>
</html>

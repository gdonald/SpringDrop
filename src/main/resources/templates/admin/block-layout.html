<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Block layout</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Block layout</h1>
  <p class="text-body-secondary" th:text="${description}"></p>

  <ul class="nav nav-tabs mb-3">
    <li class="nav-item" th:each="tab : ${tabs}">
      <a class="nav-link" th:classappend="${tab.active} ? 'active' : ''"
         th:attr="aria-current=${tab.active} ? 'page' : null"
         th:href="${tab.url}" th:text="${tab.label}">front-end</a>
    </li>
  </ul>

  <form method="post" th:action="${action}">
    <section class="mb-4" th:each="region : ${regions}" th:attr="data-region=${region.id}">
      <div class="d-flex align-items-center justify-content-between">
        <h2 class="h5 mb-0" th:text="${region.label}">Content</h2>
        <a class="btn btn-primary btn-sm" th:href="${libraryPath} + ${region.id}">Place block</a>
      </div>
      <p class="text-body-secondary mt-2" th:if="${region.rows.isEmpty()}">No blocks in this region.</p>
      <div class="table-responsive" th:if="${!region.rows.isEmpty()}">
        <table class="table align-middle" th:attr="data-drag-order=${region.id}">
          <thead>
          <tr>
            <th scope="col">Block</th>
            <th scope="col">Shows</th>
            <th scope="col">Region</th>
            <th scope="col">Weight</th>
            <th scope="col">Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="row : ${region.rows}" data-drag-handle="true" draggable="true">
            <td th:text="${row.label}">Site branding</td>
            <td class="text-body-secondary" th:text="${row.blockLabel}">Site branding</td>
            <td>
              <select class="form-select form-select-sm" th:name="${regionPrefix} + ${row.id}">
                <option th:each="option : ${regionOptions}" th:value="${option.id}"
                        th:selected="${option.id == row.region}" th:text="${option.label}">Content</option>
              </select>
            </td>
            <td>
              <input type="number" class="form-control form-control-sm" step="1" required
                     th:name="${weightPrefix} + ${row.id}" th:value="${row.weight}" data-drag-weight>
            </td>
            <td>
              <a class="btn btn-secondary btn-sm" th:href="${managePath} + ${row.id}">Edit</a>
              <a class="btn btn-danger btn-sm" th:href="${managePath} + ${row.id} + '/delete'">Remove</a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </section>

    <button type="submit" class="btn btn-primary">Save blocks</button>
  </form>
</main>
<script type="module" th:attr="nonce=${cspNonce}" th:inline="javascript">
  import { initDragOrder } from [[${@assets.url('/js/drag-order.js')}]];
  initDragOrder();
</script>
</body>
</html>

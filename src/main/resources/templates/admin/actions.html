<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Actions</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Actions</h1>
  <th:block th:replace="~{fragments/actions :: localTasks(${localTasks})}"></th:block>
  <p class="text-body-secondary" th:text="${description}"></p>

  <form method="get" th:action="${addPath}" class="row g-2 align-items-end mb-4" th:if="${!configurable.isEmpty()}">
    <div class="col-auto">
      <label class="form-label" for="action-plugin">Create an action with settings</label>
      <select class="form-select" id="action-plugin" name="plugin" required>
        <option th:each="option : ${configurable}" th:value="${option.value}" th:text="${option.label}">
          Change the author of content</option>
      </select>
    </div>
    <div class="col-auto">
      <button type="submit" class="btn btn-primary">Create</button>
    </div>
  </form>

  <div class="table-responsive">
    <table class="table align-middle admin-listing">
      <thead>
      <tr>
        <th scope="col">Action</th>
        <th scope="col">Applies to</th>
        <th scope="col">Operations</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${rows}" th:attr="data-action=${row.id}">
        <td th:text="${row.label}">Publish content</td>
        <td th:text="${row.entityType}">node</td>
        <td>
          <th:block th:if="${row.editable}">
            <a th:replace="~{fragments/actions :: edit(${managePath} + ${row.id})}"></a>
            <a th:replace="~{fragments/actions :: delete(${managePath} + ${row.id} + '/delete')}"></a>
          </th:block>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Add a block</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Add a block</h1>
  <th:block th:replace="~{fragments/actions :: localTasks(${localTasks})}"></th:block>
  <p class="text-body-secondary" th:text="${description}"></p>

  <div class="table-responsive">
    <table class="table align-middle admin-listing">
      <thead>
      <tr>
        <th scope="col">Block</th>
        <th scope="col">Id</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="definition : ${definitions}">
        <td th:text="${definition.label}">Subtitle</td>
        <td><code th:text="${definition.id}">field_block:node:article:subtitle</code></td>
        <td>
          <a th:replace="~{fragments/actions :: choose('Add block', ${addPath} + ${definition.id})}"></a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <a class="btn btn-secondary" th:href="${cancelPath}">Back to the layout</a>
</main>
</body>
</html>

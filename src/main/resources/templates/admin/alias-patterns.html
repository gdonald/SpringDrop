<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">URL alias patterns</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">URL alias patterns</h1>
  <p class="text-body-secondary" th:text="${description}"></p>

  <p><a class="btn btn-primary" th:href="${addPath}">Add URL alias pattern</a></p>

  <p class="text-body-secondary" th:if="${rows.isEmpty()}">There are no URL alias patterns yet.</p>

  <div class="table-responsive" th:if="${!rows.isEmpty()}">
    <table class="table align-middle">
      <thead>
      <tr>
        <th scope="col">Content type</th>
        <th scope="col">Pattern</th>
        <th scope="col">Made again on save</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${rows}" th:attr="data-alias-pattern=${row.bundle}">
        <td th:text="${row.label}">Article</td>
        <td class="font-monospace" th:text="${row.pattern}">/blog/[node:title]</td>
        <td th:text="${row.regenerate ? 'Yes' : 'No'}">No</td>
        <td>
          <a class="btn btn-secondary btn-sm" th:href="${managePath} + ${row.bundle}">Edit</a>
          <a class="btn btn-danger btn-sm" th:href="${managePath} + ${row.bundle} + '/delete'">Delete</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

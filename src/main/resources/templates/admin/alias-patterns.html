<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">URL alias patterns</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">URL alias patterns</h1>
  <th:block th:replace="~{fragments/actions :: localTasks(${localTasks})}"></th:block>
  <p class="text-body-secondary" th:text="${description}"></p>

  <th:block th:replace="~{fragments/actions :: localAction('Add URL alias pattern', ${addPath})}"></th:block>

  <th:block th:if="${rows.isEmpty()}"><th:block th:replace="~{fragments/actions :: empty('There are no URL alias patterns yet.')}"></th:block></th:block>

  <div class="table-responsive" th:if="${!rows.isEmpty()}">
    <table class="table align-middle admin-listing">
      <thead>
      <tr>
        <th scope="col">Content type</th>
        <th scope="col">Pattern</th>
        <th scope="col">Made again on save</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${rows}" th:attr="data-alias-pattern=${row.bundle}">
        <td th:text="${row.label}">Article</td>
        <td class="font-monospace" th:text="${row.pattern}">/blog/[node:title]</td>
        <td th:text="${row.regenerate ? 'Yes' : 'No'}">No</td>
        <td>
          <a th:replace="~{fragments/actions :: edit(${managePath} + ${row.bundle})}"></a>
          <a th:replace="~{fragments/actions :: delete(${managePath} + ${row.bundle} + '/delete')}"></a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

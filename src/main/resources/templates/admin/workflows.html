<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Workflows</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Workflows</h1>
  <p class="text-body-secondary" th:text="${description}"></p>

  <p><a class="btn btn-primary" th:href="${addPath}">Add workflow</a></p>

  <p class="text-body-secondary" th:if="${workflows.isEmpty()}">There are no workflows yet.</p>

  <div class="table-responsive" th:if="${!workflows.isEmpty()}">
    <table class="table align-middle">
      <thead>
      <tr>
        <th scope="col">Workflow</th>
        <th scope="col">Type</th>
        <th scope="col">States</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="workflow : ${workflows}">
        <td th:text="${workflow.label}">Editorial</td>
        <td class="text-body-secondary" th:text="${typeLabels.getOrDefault(workflow.type, workflow.type)}">
          Content moderation</td>
        <td th:text="${#strings.listJoin(workflow.states.![label], ', ')}">Draft, Published</td>
        <td>
          <a class="btn btn-secondary btn-sm" th:href="${managePath} + ${workflow.id}">Edit</a>
          <a class="btn btn-danger btn-sm" th:href="${managePath} + ${workflow.id} + '/delete'">Delete</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

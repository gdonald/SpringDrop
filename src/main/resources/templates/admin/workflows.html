<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Workflows</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Workflows</h1>
  <th:block th:replace="~{fragments/actions :: localTasks(${localTasks})}"></th:block>
  <p class="text-body-secondary" th:text="${description}"></p>

  <th:block th:replace="~{fragments/actions :: localAction('Add workflow', ${addPath})}"></th:block>

  <th:block th:if="${workflows.isEmpty()}"><th:block th:replace="~{fragments/actions :: empty('There are no workflows yet.')}"></th:block></th:block>

  <div class="table-responsive" th:if="${!workflows.isEmpty()}">
    <table class="table align-middle admin-listing">
      <thead>
      <tr>
        <th scope="col">Workflow</th>
        <th scope="col">Type</th>
        <th scope="col">States</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="workflow : ${workflows}">
        <td th:text="${workflow.label}">Editorial</td>
        <td class="text-body-secondary" th:text="${typeLabels.getOrDefault(workflow.type, workflow.type)}">
          Content moderation</td>
        <td th:text="${#strings.listJoin(workflow.states.![label], ', ')}">Draft, Published</td>
        <td>
          <a th:replace="~{fragments/actions :: edit(${managePath} + ${workflow.id})}"></a>
          <a th:replace="~{fragments/actions :: delete(${managePath} + ${workflow.id} + '/delete')}"></a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Block types</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Block types</h1>
  <p class="text-body-secondary" th:text="${description}"></p>

  <form method="post" th:action="${action}" data-form-states>
    <div th:utext="${formMarkup}"></div>
  </form>

  <div class="table-responsive" th:if="${!types.isEmpty()}">
    <table class="table align-middle">
      <thead>
      <tr>
        <th scope="col">Block type</th>
        <th scope="col">Machine name</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="type : ${types}">
        <td th:text="${type.label}">Basic block</td>
        <td><code th:text="${type.id}">basic</code></td>
        <td>
          <a class="btn btn-secondary btn-sm" th:href="${fieldsPath} + ${type.id} + '/fields'">Manage fields</a>
          <a class="btn btn-danger btn-sm" th:href="${managePath} + ${type.id} + '/delete'">Delete</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
<script type="module" th:attr="nonce=${cspNonce}" th:inline="javascript">
  import { initFormValidation } from [[${@assets.url('/js/form-validation.js')}]];
  initFormValidation();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Edit view</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Edit view</h1>
  <p class="text-body-secondary" th:text="${description}"></p>

  <ul class="nav nav-tabs mb-3">
    <li class="nav-item" th:each="tab : ${tabs}">
      <a class="nav-link" th:classappend="${tab.active} ? 'active'" th:href="${tab.path}" th:text="${tab.label}"
         data-view-display-tab>Default</a>
    </li>
  </ul>

  <form class="d-flex flex-wrap gap-2 mb-4" method="post" th:action="${addDisplayAction}">
    <button class="btn btn-secondary btn-sm" type="submit" name="plugin" value="page">Add page</button>
    <button class="btn btn-secondary btn-sm" type="submit" name="plugin" value="block">Add block</button>
    <button class="btn btn-secondary btn-sm" type="submit" name="plugin" value="feed">Add feed</button>
  </form>

  <div class="row g-4">
    <div class="col-lg-4">
      <h2 class="h5">Display settings</h2>
      <form method="post" th:action="${settingsAction}" data-form-states>
        <div th:utext="${settingsMarkup}"></div>
      </form>
      <form method="post" th:action="${deleteDisplayAction}" th:if="${!deleteDisplayAction.isEmpty()}">
        <button class="btn btn-danger btn-sm" type="submit">Delete this display</button>
      </form>
    </div>
    <div class="col-lg-8">
      <section class="mb-4" th:each="part : ${parts}" th:attr="data-view-part=${part.key}">
        <div class="d-flex align-items-center gap-2 mb-2">
          <h2 class="h6 mb-0 me-auto" th:text="${part.label}">Fields</h2>
          <form method="post" th:action="${part.togglePath}" th:if="${!part.togglePath.isEmpty()}">
            <button class="btn btn-secondary btn-sm" type="submit" th:text="${part.toggleLabel}">
              Change for this display only</button>
          </form>
          <a class="btn btn-secondary btn-sm" th:if="${!part.addPath.isEmpty()}" th:href="${part.addPath}">Add</a>
        </div>
        <p class="small text-body-secondary mb-1" th:if="${!part.own}">Shared with the default display.</p>
        <ul class="list-group">
          <li class="list-group-item d-flex align-items-center gap-2" th:each="item : ${part.items}">
            <span class="me-auto" th:text="${item.summary}">Label label</span>
            <a class="btn btn-secondary btn-sm" th:href="${item.editPath}">Edit</a>
            <form method="post" th:action="${item.removePath}" th:if="${!item.removePath.isEmpty()}">
              <button class="btn btn-danger btn-sm" type="submit">Remove</button>
            </form>
          </li>
        </ul>
      </section>
    </div>
  </div>

  <h2 class="h5 mt-4">Preview</h2>
  <div class="border rounded p-3 mb-4" th:utext="${preview}">Preview</div>

  <p>
    <a class="btn btn-secondary" th:href="${listPath}">Back to views</a>
    <a class="btn btn-danger" th:href="${deletePath}">Delete view</a>
  </p>
</main>
</body>
</html>

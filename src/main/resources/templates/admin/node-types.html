<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Content types</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Content types</h1>
  <th:block th:replace="~{fragments/actions :: localTasks(${localTasks})}"></th:block>
  <p class="text-body-secondary" th:text="${description}"></p>

  <th:block th:replace="~{fragments/actions :: localAction('Add content type', ${addPath})}"></th:block>

  <th:block th:if="${types.isEmpty()}"><th:block th:replace="~{fragments/actions :: empty('There are no content types yet.')}"></th:block></th:block>

  <div class="table-responsive" th:if="${!types.isEmpty()}">
    <table class="table align-middle admin-listing">
      <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Description</th>
        <th scope="col">Machine name</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="type : ${types}">
        <td th:text="${type.label}">Article</td>
        <td class="text-body-secondary" th:text="${type.description}">News and announcements.</td>
        <td><code th:text="${type.id}">article</code></td>
        <td>
          <a th:replace="~{fragments/actions :: edit(${managePath} + ${type.id})}"></a>
          <a th:replace="~{fragments/actions :: operation('Manage fields', ${fieldsPath} + ${type.id} + '/fields')}"></a>
          <a th:replace="~{fragments/actions :: operation('Manage form display', ${fieldsPath} + ${type.id} + '/form-display')}"></a>
          <a th:replace="~{fragments/actions :: operation('Manage display', ${fieldsPath} + ${type.id} + '/display')}"></a>
          <a th:replace="~{fragments/actions :: delete(${managePath} + ${type.id} + '/delete')}"></a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

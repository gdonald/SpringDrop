<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Configuration</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Configuration</h1>
  <div class="list-group admin-section" th:if="${!items.isEmpty()}">
    <a class="list-group-item list-group-item-action" th:each="item : ${items}" th:href="@{${item.link.url}}"
       th:attr="data-link=${item.link.id}">
      <span class="fw-semibold" th:text="${item.link.title}">Basic site settings</span>
      <span class="d-block small text-body-secondary" th:text="${item.link.description}">The site's name.</span>
    </a>
  </div>
  <p th:if="${items.isEmpty()}">You have no administrative pages here.</p>
</main>
</body>
</html>

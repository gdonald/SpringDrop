<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Configuration translation</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Configuration translation</h1>
  <th:block th:replace="~{fragments/actions :: localTasks(${localTasks})}"></th:block>
  <div class="table-responsive">
    <table class="table align-middle config-items admin-listing">
      <thead>
      <tr>
        <th scope="col">Type</th>
        <th scope="col">Name</th>
        <th scope="col">Operations</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="item : ${items}" th:attr="data-config=${item.name}">
        <td th:text="${item.typeLabel}">Field</td>
        <td th:text="${item.label}">Summary</td>
        <td><a th:replace="~{fragments/actions :: operation('Translate', ${itemPath} + ${item.name})}"></a></td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

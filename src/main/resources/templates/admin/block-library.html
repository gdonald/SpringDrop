<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Place a block</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Place a block</h1>
  <p class="text-body-secondary" th:text="${description}"></p>

  <div class="table-responsive">
    <table class="table align-middle">
      <thead>
      <tr>
        <th scope="col">Block</th>
        <th scope="col">Id</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="definition : ${definitions}">
        <td th:text="${definition.label}">Site branding</td>
        <td><code th:text="${definition.id}">system_branding_block</code></td>
        <td>
          <a class="btn btn-primary btn-sm"
             th:href="${addPath} + ${definition.id} + '/' + ${theme} + '?region=' + ${region}">Place block</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <a class="btn btn-secondary" th:href="${cancelPath}">Back to the block layout</a>
</main>
</body>
</html>

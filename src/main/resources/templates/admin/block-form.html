<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Block</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Block</h1>
  <p class="text-body-secondary" th:text="${description}"></p>

  <form method="post" th:action="${action}" data-form-states>
    <div th:utext="${formMarkup}"></div>
  </form>
</main>
<script type="module" th:attr="nonce=${cspNonce}" th:inline="javascript">
  import { initFormStates } from [[${@assets.url('/js/form-states.js')}]];
  import { initFormValidation } from [[${@assets.url('/js/form-validation.js')}]];
  import { initFileUpload } from [[${@assets.url('/js/file-upload.js')}]];
  import { initEditors } from [[${@assets.url('/js/editor.js')}]];
  import { initMediaLibrary } from [[${@assets.url('/js/media-library.js')}]];
  initFormStates();
  initFormValidation();
  initFileUpload();
  initEditors();
  initMediaLibrary();
</script>
</body>
</html>

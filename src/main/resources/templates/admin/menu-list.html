<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Menus</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Menus</h1>
  <th:block th:replace="~{fragments/actions :: localTasks(${localTasks})}"></th:block>
  <p class="text-body-secondary" th:text="${description}"></p>

  <form method="post" th:action="${action}">
    <div th:utext="${formMarkup}"></div>
  </form>

  <div class="table-responsive" th:if="${!menus.isEmpty()}">
    <table class="table align-middle admin-listing">
      <thead>
      <tr>
        <th scope="col">Menu</th>
        <th scope="col">Description</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="menu : ${menus}">
        <td th:text="${menu.label}">Main navigation</td>
        <td class="text-body-secondary" th:text="${menu.description}"></td>
        <td>
          <a th:replace="~{fragments/actions :: operation('Edit links', ${managePath} + ${menu.id})}"></a>
          <th:block th:if="${!menu.locked}"><a th:replace="~{fragments/actions :: delete(${managePath} + ${menu.id} + '/delete')}"></a></th:block>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Menus</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Menus</h1>
  <p class="text-body-secondary" th:text="${description}"></p>

  <form method="post" th:action="${action}">
    <div th:utext="${formMarkup}"></div>
  </form>

  <div class="table-responsive" th:if="${!menus.isEmpty()}">
    <table class="table align-middle">
      <thead>
      <tr>
        <th scope="col">Menu</th>
        <th scope="col">Description</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="menu : ${menus}">
        <td th:text="${menu.label}">Main navigation</td>
        <td class="text-body-secondary" th:text="${menu.description}"></td>
        <td>
          <a class="btn btn-secondary btn-sm"
             th:href="${managePath} + ${menu.id}">Edit links</a>
          <a class="btn btn-danger btn-sm" th:if="${!menu.locked}"
             th:href="${managePath} + ${menu.id} + '/delete'">Delete</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

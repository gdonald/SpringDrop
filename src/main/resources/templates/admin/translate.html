<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">User interface translation</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">User interface translation</h1>
  <th:block th:replace="~{fragments/actions :: localTasks(${localTasks})}"></th:block>

  <p class="d-flex gap-2">
    <a class="btn btn-secondary" th:href="${importPath}">Import</a>
    <a class="btn btn-secondary" th:href="${exportPath}">Export</a>
  </p>

  <p th:if="${languages.isEmpty()}" class="no-languages">Add a language other than English to translate the
    interface into it.</p>

  <th:block th:if="${!languages.isEmpty()}">
    <form method="get" th:action="@{/admin/config/regional/translate}" class="row g-2 align-items-end mb-3 translate-filters">
      <div class="col-auto">
        <label class="form-label" for="translate-language">Translation language</label>
        <select class="form-select" id="translate-language" name="langcode">
          <option th:each="language : ${languages}" th:value="${language.id}" th:text="${language.label}"
                  th:selected="${language.id == chosen}">French</option>
        </select>
      </div>
      <div class="col-auto">
        <label class="form-label" for="translate-search">Contains</label>
        <input class="form-control" id="translate-search" type="search" name="search" th:value="${search}">
      </div>
      <div class="col-auto form-check mb-2">
        <input class="form-check-input" id="translate-untranslated" type="checkbox" name="untranslated"
               value="true" th:checked="${untranslated}">
        <label class="form-check-label" for="translate-untranslated">Untranslated only</label>
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-primary">Filter</button>
      </div>
    </form>

    <form method="post" th:action="${action}" th:if="${!rows.isEmpty()}">
      <input type="hidden" name="langcode" th:value="${chosen}">
      <input type="hidden" name="search" th:value="${search}">
      <input type="hidden" name="ids" th:value="${#strings.listJoin(rows.![id], ',')}">
      <table class="table align-middle translate-strings admin-listing">
        <thead>
        <tr>
          <th scope="col">Source string</th>
          <th scope="col">Translation</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${rows}" th:attr="data-string=${row.id}">
          <td>
            <div th:each="source : ${row.sources}" th:text="${source}">Read more</div>
            <small class="text-body-secondary" th:if="${!row.context.isEmpty()}"
                   th:text="'In context: ' + ${row.context}">In context: menu</small>
          </td>
          <td>
            <textarea class="form-control mb-1" rows="1" th:each="form, state : ${row.forms}"
                      th:name="${row.fieldName(state.index)}" th:text="${form}"
                      th:attr="aria-label=${'Translation of ' + row.sources[0]}"></textarea>
          </td>
        </tr>
        </tbody>
      </table>
      <button type="submit" class="btn btn-primary">Save translations</button>
    </form>
    <p th:if="${rows.isEmpty()}">No strings available.</p>

    <nav aria-label="Pagination" th:if="${!pager.pages.isEmpty()}" class="mt-3">
      <ul class="pagination">
        <li class="page-item" th:each="link : ${pager.pages}" th:classappend="${link.current ? 'active' : ''}">
          <a class="page-link" th:href="${link.url}" th:text="${link.number}">1</a></li>
      </ul>
    </nav>
  </th:block>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Differences</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Differences in node_type.article</h1>
  <div class="row g-3">
    <div class="col-md-6">
      <h2 class="h6">On the site</h2>
      <pre class="border rounded p-2 config-active" th:text="${active}">label: Article</pre>
    </div>
    <div class="col-md-6">
      <h2 class="h6">In the sync directory</h2>
      <pre class="border rounded p-2 config-staged" th:text="${staged}">label: News</pre>
    </div>
  </div>
  <a class="btn btn-secondary" th:href="@{${back}}">Back to synchronize</a>
</main>
</body>
</html>

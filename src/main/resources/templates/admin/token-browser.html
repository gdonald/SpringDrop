<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Available tokens</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3">Available tokens</h1>
  <p class="text-body-secondary">
    Paste a token into any field that accepts one. Tokens are replaced when the text
    is rendered.
  </p>

  <div class="card mb-4" th:each="group : ${tokenGroups}">
    <div class="card-header" th:text="${group.type}">type</div>
    <div class="table-responsive">
      <table class="table mb-0">
        <thead>
        <tr>
          <th scope="col">Token</th>
          <th scope="col">Replacement</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="token : ${group.tokens}">
          <td>
            <code th:text="'[' + ${group.type} + ':' + ${token.name} + ']'">[site:name]</code>
          </td>
          <td th:text="${token.description}">The name of the site</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Comments</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Comments</h1>

  <ul class="nav nav-tabs mb-3">
    <li class="nav-item" th:each="tab : ${tabs}">
      <a class="nav-link" th:classappend="${tab.active} ? 'active' : ''"
         th:attr="aria-current=${tab.active} ? 'page' : null"
         th:href="${tab.url}" th:text="${tab.label}">Published comments</a>
    </li>
  </ul>

  <div class="alert alert-danger" role="alert" th:if="${!error.isEmpty()}" th:text="${error}">Error</div>

  <p class="text-body-secondary" th:if="${rows.isEmpty()}">There are no comments here.</p>

  <form method="post" th:action="${action}" th:if="${!rows.isEmpty()}" data-bulk-select>
    <div class="d-flex flex-wrap align-items-end gap-2 mb-3">
      <div>
        <label class="form-label" for="operation">Action</label>
        <select class="form-select" id="operation" name="operation" required>
          <option th:each="option : ${operations}" th:value="${option.value}" th:text="${option.label}">Delete</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" data-bulk-apply>Apply to selected</button>
    </div>
    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
        <tr>
          <th scope="col"><span class="visually-hidden">Select</span></th>
          <th scope="col">Subject</th>
          <th scope="col">Author</th>
          <th scope="col">Posted in</th>
          <th scope="col">Updated</th>
          <th scope="col">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${rows}" th:attr="data-comment=${row.id}">
          <td>
            <input class="form-check-input" type="checkbox" value="true" data-bulk-row
                   th:name="${rowPrefix} + ${row.id}" th:attr="aria-label='Select ' + ${row.subject}">
          </td>
          <td><a th:href="'/comment/' + ${row.id}" th:text="${row.subject}">Thanks</a></td>
          <td th:text="${row.author}">edith</td>
          <td><a th:href="${row.postedInUrl}" th:text="${row.postedIn}">Spring schedule</a></td>
          <td th:text="${row.updated}">10/03/2026 - 09:00</td>
          <td><a class="btn btn-secondary btn-sm" th:href="'/comment/' + ${row.id} + '/edit'">Edit</a></td>
        </tr>
        </tbody>
      </table>
    </div>
  </form>
</main>
<script type="module" th:attr="nonce=${cspNonce}" th:inline="javascript">
  import { initBulkSelection } from [[${@assets.url('/js/bulk-selection.js')}]];
  initBulkSelection();
</script>
</body>
</html>

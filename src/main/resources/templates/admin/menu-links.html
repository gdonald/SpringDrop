<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Menu links</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Menu links</h1>
  <th:block th:replace="~{fragments/actions :: localTasks(${localTasks})}"></th:block>
  <p class="text-body-secondary" th:text="${description}"></p>

  <th:block th:replace="~{fragments/actions :: localAction('Add link', ${addPath})}"></th:block>

  <form method="post" th:action="${action}">
    <div class="table-responsive">
      <table class="table align-middle admin-listing" data-drag-order="menu-links">
        <thead>
        <tr>
          <th scope="col">Link</th>
          <th scope="col">Goes to</th>
          <th scope="col">Enabled</th>
          <th scope="col">Weight</th>
          <th scope="col">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${rows}" th:attr="data-drag-handle=${row.stored} ? 'true' : null"
            th:draggable="${row.stored}">
          <td>
            <span th:style="'padding-left: ' + ${row.depth} + 'rem'" th:text="${row.title}">Home</span>
          </td>
          <td><code th:text="${row.url}">/</code></td>
          <td>
            <input type="checkbox" class="form-check-input" th:if="${row.stored}"
                   th:name="${enabledPrefix} + ${row.id}" th:checked="${row.enabled}">
            <span class="text-body-secondary" th:if="${!row.stored}"
                  th:text="${row.enabled} ? 'Yes' : 'No'">Yes</span>
          </td>
          <td>
            <input type="number" class="form-control form-control-sm" th:if="${row.stored}"
                   th:name="${weightPrefix} + ${row.id}" th:value="${row.weight}"
                   data-drag-weight>
            <span class="text-body-secondary" th:if="${!row.stored}" th:text="${row.weight}">0</span>
          </td>
          <td>
            <th:block th:if="${row.stored}">
              <a th:replace="~{fragments/actions :: edit(${linkPath} + ${row.id.substring(row.id.indexOf(':') + 1)} + '/edit')}"></a>
              <a th:replace="~{fragments/actions :: delete(${linkPath} + ${row.id.substring(row.id.indexOf(':') + 1)} + '/delete')}"></a>
            </th:block>
            <span class="badge text-bg-secondary" th:if="${!row.stored}">Provided by a module</span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <button type="submit" class="btn btn-primary">Save order</button>
  </form>

</main>
<script type="module" th:attr="nonce=${cspNonce}" th:inline="javascript">
  import { initDragOrder } from [[${@assets.url('/js/drag-order.js')}]];
  initDragOrder();
</script>
</body>
</html>

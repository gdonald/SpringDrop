<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Image styles</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Image styles</h1>
  <p class="text-body-secondary" th:text="${description}"></p>

  <p><a class="btn btn-primary" th:href="${addPath}">Add image style</a></p>

  <div class="table-responsive">
    <table class="table align-middle">
      <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Effects</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${rows}" th:attr="data-style=${row.id}">
        <td th:text="${row.label}">Thumbnail</td>
        <td th:text="${row.effects.isEmpty() ? 'No effects' : row.effects}">Scale 100 by 100</td>
        <td>
          <a class="btn btn-secondary btn-sm" th:href="${managePath} + ${row.id}">Edit</a>
          <a class="btn btn-danger btn-sm"
             th:href="${managePath} + ${row.id} + '/delete'">Delete</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Manage fields</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Manage fields</h1>
  <p class="text-body-secondary" th:if="${description}" th:text="${description}"></p>

  <div th:if="${listing}" th:utext="${listing}"></div>

  <form th:if="${formMarkup}" method="post" th:action="${action}">
    <div th:utext="${formMarkup}"></div>
  </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"
        integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
        crossorigin="anonymous"></script>
<script type="module" th:attr="nonce=${cspNonce}">
  import { initFormStates } from '/js/form-states.js';
  import { initFormValidation } from '/js/form-validation.js';
  initFormStates();
  initFormValidation();
</script>
</body>
</html>

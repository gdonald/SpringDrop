<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Extend</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Extend</h1>
  <th:block th:replace="~{fragments/actions :: localTasks(${localTasks})}"></th:block>
  <p class="text-body-secondary">Tick a module to enable it and untick it to disable it. A module another enabled
    module needs stays on.</p>
  <form method="post" th:action="${action}">
    <fieldset class="mb-4" th:each="entry : ${packages}" th:attr="data-package=${entry.key}">
      <legend class="h5" th:text="${entry.key}">Core</legend>
      <table class="table align-middle admin-listing">
        <thead>
        <tr>
          <th scope="col">Enabled</th>
          <th scope="col">Module</th>
          <th scope="col">Version</th>
          <th scope="col">Description</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="module : ${entry.value}" th:attr="data-module=${module.name}">
          <td>
            <input class="form-check-input" type="checkbox" value="true"
                   th:id="${'enable_' + module.name}" th:name="${'enable_' + module.name}"
                   th:checked="${module.enabled}" th:disabled="${module.locked}">
            <input type="hidden" th:if="${module.locked}" th:name="${'enable_' + module.name}" value="true">
          </td>
          <td><label th:for="${'enable_' + module.name}" th:text="${module.label}">Foundation</label></td>
          <td th:text="${module.version}">1.0</td>
          <td>
            <span th:text="${module.description}">Base module.</span>
            <div class="small text-body-secondary" th:if="${!module.requires.isEmpty()}"
                 th:text="${'Requires: ' + #strings.listJoin(module.requires, ', ')}">Requires: Foundation</div>
            <div class="small text-body-secondary" th:if="${!module.requiredBy.isEmpty()}"
                 th:text="${'Required by: ' + #strings.listJoin(module.requiredBy, ', ')}">Required by: Blog</div>
          </td>
        </tr>
        </tbody>
      </table>
    </fieldset>
    <button type="submit" class="btn btn-primary">Save configuration</button>
  </form>
</main>
</body>
</html>

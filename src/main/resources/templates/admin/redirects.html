<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Redirects</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Redirects</h1>
  <p class="text-body-secondary" th:text="${description}"></p>

  <p><a class="btn btn-primary" th:href="${addPath}">Add redirect</a></p>

  <p class="text-body-secondary" th:if="${rows.isEmpty()}">There are no redirects yet.</p>

  <div class="table-responsive" th:if="${!rows.isEmpty()}">
    <table class="table align-middle">
      <thead>
      <tr>
        <th scope="col">From</th>
        <th scope="col">To</th>
        <th scope="col">Status</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${rows}" th:attr="data-redirect=${row.id}">
        <td class="font-monospace" th:text="${row.source}">/old-page</td>
        <td class="font-monospace" th:text="${row.destination}">/about</td>
        <td th:text="${row.status}">301</td>
        <td>
          <a class="btn btn-secondary btn-sm" th:href="${managePath} + ${row.id}">Edit</a>
          <a class="btn btn-danger btn-sm" th:href="${managePath} + ${row.id} + '/delete'">Delete</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

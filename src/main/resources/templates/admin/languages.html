<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Languages</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Languages</h1>
  <th:block th:replace="~{fragments/actions :: localTasks(${localTasks})}"></th:block>
  <p class="text-body-secondary" th:text="${description}"></p>

  <th:block th:replace="~{fragments/actions :: localAction('Add language', ${addPath})}"></th:block>
  <p><a class="btn btn-secondary" th:href="${detectionPath}">Detection and selection</a></p>

  <div class="table-responsive">
    <table class="table align-middle admin-listing">
      <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Code</th>
        <th scope="col">Direction</th>
        <th scope="col">Prefix</th>
        <th scope="col">Domain</th>
        <th scope="col">Operations</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="language : ${languages}" th:attr="data-language=${language.id}">
        <td>
          <span th:text="${language.label}">English</span>
          <span class="badge text-bg-primary" th:if="${language.id == defaultLangcode}">Default</span>
        </td>
        <td th:text="${language.id}">en</td>
        <td th:text="${language.direction == 'rtl' ? 'Right to left' : 'Left to right'}">Left to right</td>
        <td th:text="${language.prefix}">fr</td>
        <td th:text="${language.domain}">fr.example.com</td>
        <td>
          <a th:replace="~{fragments/actions :: edit(${managePath} + ${language.id})}"></a>
          <th:block th:if="${language.id != defaultLangcode}"><a th:replace="~{fragments/actions :: delete(${managePath} + ${language.id} + '/delete')}"></a></th:block>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

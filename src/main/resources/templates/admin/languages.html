<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Languages</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Languages</h1>
  <p class="text-body-secondary" th:text="${description}"></p>

  <p class="d-flex gap-2">
    <a class="btn btn-primary" th:href="${addPath}">Add language</a>
    <a class="btn btn-secondary" th:href="${detectionPath}">Detection and selection</a>
  </p>

  <div class="table-responsive">
    <table class="table align-middle">
      <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Code</th>
        <th scope="col">Direction</th>
        <th scope="col">Prefix</th>
        <th scope="col">Domain</th>
        <th scope="col">Operations</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="language : ${languages}" th:attr="data-language=${language.id}">
        <td>
          <span th:text="${language.label}">English</span>
          <span class="badge text-bg-primary" th:if="${language.id == defaultLangcode}">Default</span>
        </td>
        <td th:text="${language.id}">en</td>
        <td th:text="${language.direction == 'rtl' ? 'Right to left' : 'Left to right'}">Left to right</td>
        <td th:text="${language.prefix}">fr</td>
        <td th:text="${language.domain}">fr.example.com</td>
        <td>
          <a class="btn btn-secondary btn-sm" th:href="${managePath} + ${language.id}">Edit</a>
          <a class="btn btn-danger btn-sm" th:if="${language.id != defaultLangcode}"
             th:href="${managePath} + ${language.id} + '/delete'">Delete</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Moderated content</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Moderated content</h1>

  <form method="get" th:action="${action}" class="d-flex flex-wrap align-items-end gap-2 mb-4">
    <div>
      <label class="form-label" for="state">Moderation state</label>
      <select class="form-select" id="state" name="state">
        <option value="" th:selected="${chosenState.isEmpty()}">Not yet published</option>
        <option th:each="option : ${states}" th:value="${option.value}" th:text="${option.label}"
                th:selected="${option.value == chosenState}">Draft</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Filter</button>
  </form>

  <p class="text-body-secondary" th:if="${rows.isEmpty()}">There is no moderated content in this state.</p>

  <div class="table-responsive" th:if="${!rows.isEmpty()}">
    <table class="table align-middle">
      <thead>
      <tr>
        <th scope="col">Title</th>
        <th scope="col">Content type</th>
        <th scope="col">Moderation state</th>
        <th scope="col">Updated by</th>
        <th scope="col">Updated</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${rows}" th:attr="data-node=${row.id}">
        <td><a th:href="${row.url}" th:text="${row.title}">Spring schedule</a></td>
        <td th:text="${row.type}">Article</td>
        <td th:text="${row.state}">Draft</td>
        <td th:text="${row.author}">edith</td>
        <td th:text="${row.updated}">10/03/2026 - 09:00</td>
        <td>
          <a class="btn btn-secondary btn-sm" th:if="${row.editable}"
             th:href="'/node/' + ${row.id} + '/edit'">Edit</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

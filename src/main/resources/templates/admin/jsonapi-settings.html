<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">JSON:API</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">JSON:API</h1>
  <p class="text-body-secondary">Every write also needs access to the entity and to each field it changes.</p>
  <form method="post" th:action="${action}">
    <fieldset class="mb-3">
      <legend class="h6">Allowed operations</legend>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="operations" id="operations-read-only" value="read_only"
               th:checked="${readOnly}">
        <label class="form-check-label" for="operations-read-only">Accept only JSON:API read operations.</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="operations" id="operations-read-write" value="read_write"
               th:checked="${!readOnly}">
        <label class="form-check-label" for="operations-read-write">Accept all JSON:API create, read, update, and
          delete operations.</label>
      </div>
    </fieldset>
    <button type="submit" class="btn btn-primary">Save configuration</button>
  </form>
</main>
</body>
</html>

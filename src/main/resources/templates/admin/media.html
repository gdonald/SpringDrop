<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Media</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Media</h1>

  <p><a class="btn btn-primary" th:href="${addPath}">Add media</a></p>

  <p class="text-body-secondary" th:if="${rows.isEmpty()}">There is no media yet.</p>

  <div class="table-responsive" th:if="${!rows.isEmpty()}">
    <table class="table align-middle">
      <thead>
      <tr>
        <th scope="col">Thumbnail</th>
        <th scope="col">Name</th>
        <th scope="col">Type</th>
        <th scope="col">Status</th>
        <th scope="col">Updated</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${rows}" th:attr="data-media=${row.id}">
        <td><img th:if="${!row.thumbnail.isEmpty()}" th:src="${row.thumbnail}" alt="" width="100" loading="lazy"></td>
        <td><a th:href="@{'/media/' + ${row.id}}" th:text="${row.label}">Main hall</a></td>
        <td th:text="${row.type}">Image</td>
        <td th:text="${row.published ? 'Published' : 'Unpublished'}">Published</td>
        <td th:text="${row.changed}">2026-10-03</td>
        <td>
          <a class="btn btn-secondary btn-sm" th:if="${row.editable}" th:href="@{'/media/' + ${row.id} + '/edit'}">Edit</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Media</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Media</h1>
  <th:block th:replace="~{fragments/actions :: localTasks(${localTasks})}"></th:block>

  <th:block th:replace="~{fragments/actions :: localAction('Add media', ${addPath})}"></th:block>

  <th:block th:if="${rows.isEmpty()}"><th:block th:replace="~{fragments/actions :: empty('There is no media yet.')}"></th:block></th:block>

  <div class="table-responsive" th:if="${!rows.isEmpty()}">
    <table class="table align-middle admin-listing">
      <thead>
      <tr>
        <th scope="col">Thumbnail</th>
        <th scope="col">Name</th>
        <th scope="col">Type</th>
        <th scope="col">Status</th>
        <th scope="col">Updated</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${rows}" th:attr="data-media=${row.id}">
        <td><img th:if="${!row.thumbnail.isEmpty()}" th:src="${row.thumbnail}" alt="" width="100" loading="lazy"></td>
        <td><a th:href="@{'/media/' + ${row.id}}" th:text="${row.label}">Main hall</a></td>
        <td th:text="${row.type}">Image</td>
        <td th:text="${row.published ? 'Published' : 'Unpublished'}">Published</td>
        <td th:text="${row.changed}">2026-10-03</td>
        <td>
          <th:block th:if="${row.editable}"><a th:replace="~{fragments/actions :: edit('/media/' + ${row.id} + '/edit')}"></a></th:block>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

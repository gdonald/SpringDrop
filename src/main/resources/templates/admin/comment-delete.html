<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Delete these comments?</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Delete these comments?</h1>
  <p class="text-body-secondary">Every reply to them is deleted too. This action cannot be undone.</p>

  <ul class="mb-4">
    <li th:each="row : ${rows}" th:text="${row.subject}">Thanks</li>
  </ul>

  <form method="post" th:action="${action}">
    <input type="hidden" name="operation" value="delete">
    <input type="hidden" name="confirmed" value="true">
    <input type="hidden" value="true" th:each="row : ${rows}" th:name="${rowPrefix} + ${row.id}">
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-danger">Delete comments</button>
      <a class="btn btn-secondary" th:href="${cancelPath}">Cancel</a>
    </div>
  </form>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Banned addresses</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Banned addresses</h1>
  <p class="text-body-secondary" th:text="${description}"></p>

  <form method="post" th:action="${action}">
    <div th:utext="${formMarkup}"></div>
  </form>

  <table class="table" th:if="${!banned.isEmpty()}">
    <thead>
    <tr>
      <th scope="col">Address</th>
      <th scope="col">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="address : ${banned}">
      <td th:text="${address}">10.0.0.5</td>
      <td>
        <form method="post" th:action="${unbanAction}">
          <input type="hidden" th:name="${addressField}" th:value="${address}">
          <button type="submit" class="btn btn-secondary btn-sm">Unban</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
  <p th:if="${banned.isEmpty()}">No addresses are banned.</p>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Edit workflow</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Edit Editorial</h1>
  <p class="text-body-secondary">Workflow type: <span th:text="${typeLabel}">Content moderation</span></p>
  <p th:if="${!moderationPath.isEmpty()}">
    <a class="btn btn-secondary" th:href="${moderationPath}">Moderation settings</a>
  </p>

  <form method="post" th:action="${action}" data-form-states>
    <div th:utext="${formMarkup}"></div>
  </form>

  <section class="mt-4" data-section="states">
    <div class="d-flex align-items-center justify-content-between">
      <h2 class="h5 mb-0">States</h2>
      <a class="btn btn-primary btn-sm" th:href="${action} + '/state/add'">Add a state</a>
    </div>
    <div class="table-responsive mt-2">
      <table class="table align-middle">
        <thead>
        <tr>
          <th scope="col">State</th>
          <th scope="col">Machine name</th>
          <th scope="col">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="state : ${states}" th:attr="data-state=${state.id}">
          <td th:text="${state.label}">Draft</td>
          <td><code th:text="${state.id}">draft</code></td>
          <td>
            <a class="btn btn-secondary btn-sm" th:href="${action} + '/state/' + ${state.id}">Edit</a>
            <a class="btn btn-danger btn-sm" th:if="${!required.contains(state.id)}"
               th:href="${action} + '/state/' + ${state.id} + '/delete'">Delete</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="mt-4" data-section="transitions">
    <div class="d-flex align-items-center justify-content-between">
      <h2 class="h5 mb-0">Transitions</h2>
      <a class="btn btn-primary btn-sm" th:href="${action} + '/transition/add'">Add a transition</a>
    </div>
    <div class="table-responsive mt-2">
      <table class="table align-middle">
        <thead>
        <tr>
          <th scope="col">Transition</th>
          <th scope="col">From</th>
          <th scope="col">To</th>
          <th scope="col">Permission</th>
          <th scope="col">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="transition : ${transitions}" th:attr="data-transition=${transition.id}">
          <td th:text="${transition.label}">Publish</td>
          <td th:text="${transition.from}">Draft</td>
          <td th:text="${transition.to}">Published</td>
          <td><code th:text="${transition.permission}">use editorial transition publish</code></td>
          <td>
            <a class="btn btn-secondary btn-sm" th:href="${action} + '/transition/' + ${transition.id}">Edit</a>
            <a class="btn btn-danger btn-sm"
               th:href="${action} + '/transition/' + ${transition.id} + '/delete'">Delete</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>

  <p class="mt-4"><a class="btn btn-danger" th:href="${action} + '/delete'">Delete workflow</a></p>
</main>
<script type="module" th:attr="nonce=${cspNonce}" th:inline="javascript">
  import { initFormValidation } from [[${@assets.url('/js/form-validation.js')}]];
  initFormValidation();
</script>
</body>
</html>

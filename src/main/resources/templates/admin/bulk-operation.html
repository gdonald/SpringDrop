<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Apply Delete content to 2 items?</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Apply Delete content to 2 items?</h1>

  <th:block th:if="${errors != null}">
    <div class="alert alert-danger" role="alert">
      <p class="mb-0 bulk-error" th:each="error : ${errors}" th:text="${error}">Choose an action.</p>
    </div>
    <a class="btn btn-secondary" th:href="${cancelPath}">Back to the listing</a>
  </th:block>

  <th:block th:if="${errors == null}">
    <p class="text-body-secondary">This action cannot be undone.</p>
    <ul class="mb-4 bulk-items">
      <li th:each="label : ${labels}" th:text="${label}">Spring schedule</li>
    </ul>
    <form method="post" th:action="${action}">
      <input type="hidden" name="action" th:value="${actionId}">
      <input type="hidden" name="destination" th:value="${destination}">
      <input type="hidden" name="confirmed" value="true">
      <input type="hidden" name="items" th:each="item : ${items}" th:value="${item}">
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-danger" th:text="${confirmLabel}">Delete content</button>
        <a class="btn btn-secondary" th:href="${cancelPath}">Cancel</a>
      </div>
    </form>
  </th:block>
</main>
</body>
</html>

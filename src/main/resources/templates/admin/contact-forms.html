<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Contact forms</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Contact forms</h1>
  <p class="text-body-secondary" th:text="${description}"></p>

  <p><a class="btn btn-primary" th:href="${addPath}">Add contact form</a></p>

  <div class="table-responsive">
    <table class="table align-middle">
      <thead>
      <tr>
        <th scope="col">Form</th>
        <th scope="col">Recipients</th>
        <th scope="col">Default</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="form : ${forms}" th:attr="data-form=${form.id}">
        <td th:text="${form.label}">Website feedback</td>
        <td th:text="${form.personal() ? 'Selected user' : #strings.listJoin(form.recipients, ', ')}">
          feedback@example.com</td>
        <td th:text="${form.selected ? 'Yes' : 'No'}">Yes</td>
        <td>
          <a class="btn btn-secondary btn-sm" th:href="${managePath} + ${form.id}">Edit</a>
          <a class="btn btn-secondary btn-sm" th:href="${fieldsPath} + ${form.id} + '/fields'">Manage fields</a>
          <a class="btn btn-danger btn-sm" th:if="${!form.personal()}"
             th:href="${managePath} + ${form.id} + '/delete'">Delete</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

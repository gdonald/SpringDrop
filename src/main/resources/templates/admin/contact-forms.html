<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Contact forms</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Contact forms</h1>
  <th:block th:replace="~{fragments/actions :: localTasks(${localTasks})}"></th:block>
  <p class="text-body-secondary" th:text="${description}"></p>

  <th:block th:replace="~{fragments/actions :: localAction('Add contact form', ${addPath})}"></th:block>

  <div class="table-responsive">
    <table class="table align-middle admin-listing">
      <thead>
      <tr>
        <th scope="col">Form</th>
        <th scope="col">Recipients</th>
        <th scope="col">Default</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="form : ${forms}" th:attr="data-form=${form.id}">
        <td th:text="${form.label}">Website feedback</td>
        <td th:text="${form.personal() ? 'Selected user' : #strings.listJoin(form.recipients, ', ')}">
          feedback@example.com</td>
        <td th:text="${form.selected ? 'Yes' : 'No'}">Yes</td>
        <td>
          <a th:replace="~{fragments/actions :: edit(${managePath} + ${form.id})}"></a>
          <a th:replace="~{fragments/actions :: operation('Manage fields', ${fieldsPath} + ${form.id} + '/fields')}"></a>
          <th:block th:if="${!form.personal()}"><a th:replace="~{fragments/actions :: delete(${managePath} + ${form.id} + '/delete')}"></a></th:block>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Taxonomy</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Taxonomy</h1>
  <th:block th:replace="~{fragments/actions :: localTasks(${localTasks})}"></th:block>
  <p class="text-body-secondary" th:text="${description}"></p>

  <th:block th:replace="~{fragments/actions :: localAction('Add vocabulary', ${addPath})}"></th:block>

  <th:block th:if="${vocabularies.isEmpty()}"><th:block th:replace="~{fragments/actions :: empty('There are no vocabularies yet.')}"></th:block></th:block>

  <div class="table-responsive" th:if="${!vocabularies.isEmpty()}">
    <table class="table align-middle admin-listing">
      <thead>
      <tr>
        <th scope="col">Vocabulary</th>
        <th scope="col">Description</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="vocabulary : ${vocabularies}" th:attr="data-vocabulary=${vocabulary.id}">
        <td th:text="${vocabulary.label}">Tags</td>
        <td class="text-body-secondary" th:text="${vocabulary.description}">Words that describe content.</td>
        <td>
          <a th:replace="~{fragments/actions :: operation('List terms', ${managePath} + ${vocabulary.id} + '/overview')}"></a>
          <a th:replace="~{fragments/actions :: edit(${managePath} + ${vocabulary.id})}"></a>
          <a th:replace="~{fragments/actions :: operation('Manage fields', ${fieldsPath} + ${vocabulary.id} + '/fields')}"></a>
          <a th:replace="~{fragments/actions :: delete(${managePath} + ${vocabulary.id} + '/delete')}"></a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

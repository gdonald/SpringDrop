<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Custom block library</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Custom block library</h1>
  <th:block th:replace="~{fragments/actions :: localTasks(${localTasks})}"></th:block>
  <p class="text-body-secondary" th:text="${description}"></p>

  <th:block th:each="type : ${types}"><th:block th:replace="~{fragments/actions :: localAction('Add ' + ${type.label} + ' block', ${addPath} + ${type.id})}"></th:block></th:block>
  <th:block th:if="${types.isEmpty()}"><th:block th:replace="~{fragments/actions :: empty('There are no block types yet. Add one before writing a custom block.')}"></th:block></th:block>

  <div class="table-responsive" th:if="${!blocks.isEmpty()}">
    <table class="table align-middle admin-listing">
      <thead>
      <tr>
        <th scope="col">Block description</th>
        <th scope="col">Block type</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="block : ${blocks}">
        <td th:text="${block.label}">Opening hours</td>
        <td class="text-body-secondary" th:text="${typeLabels.getOrDefault(block.bundle, block.bundle)}">Basic</td>
        <td>
          <a th:replace="~{fragments/actions :: edit(${blockPath} + ${block.id} + '/edit')}"></a>
          <a th:replace="~{fragments/actions :: delete(${blockPath} + ${block.id} + '/delete')}"></a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

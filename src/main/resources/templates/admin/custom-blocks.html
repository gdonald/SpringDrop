<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Custom block library</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Custom block library</h1>
  <p class="text-body-secondary" th:text="${description}"></p>

  <p class="d-flex flex-wrap gap-2" th:if="${!types.isEmpty()}">
    <a class="btn btn-primary" th:each="type : ${types}" th:href="${addPath} + ${type.id}"
       th:text="'Add ' + ${type.label} + ' block'">Add Basic block</a>
  </p>
  <p class="text-body-secondary" th:if="${types.isEmpty()}">
    There are no block types yet. Add one before writing a custom block.
  </p>

  <div class="table-responsive" th:if="${!blocks.isEmpty()}">
    <table class="table align-middle">
      <thead>
      <tr>
        <th scope="col">Block description</th>
        <th scope="col">Block type</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="block : ${blocks}">
        <td th:text="${block.label}">Opening hours</td>
        <td class="text-body-secondary" th:text="${typeLabels.getOrDefault(block.bundle, block.bundle)}">Basic</td>
        <td>
          <a class="btn btn-secondary btn-sm" th:href="${blockPath} + ${block.id} + '/edit'">Edit</a>
          <a class="btn btn-danger btn-sm" th:href="${blockPath} + ${block.id} + '/delete'">Delete</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

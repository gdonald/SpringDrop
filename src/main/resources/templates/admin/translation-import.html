<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Import translations</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Import translations</h1>

  <div class="alert alert-danger" role="alert" th:if="${!errors.isEmpty()}">
    <p class="mb-0 import-error" th:each="error : ${errors}" th:text="${error}">Choose a .po file.</p>
  </div>

  <form method="post" th:action="${action}" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label" for="import-file">Translation file</label>
      <input class="form-control" id="import-file" type="file" name="file" accept=".po" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="import-language">Language</label>
      <select class="form-select" id="import-language" name="langcode" required>
        <option th:each="language : ${languages}" th:value="${language.id}" th:text="${language.label}">French</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Import</button>
  </form>
</main>
</body>
</html>

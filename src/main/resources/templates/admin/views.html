<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Views</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Views</h1>
  <p class="text-body-secondary" th:text="${description}"></p>

  <p><a class="btn btn-primary" th:href="${addPath}">Add view</a></p>

  <p class="text-body-secondary" th:if="${rows.isEmpty()}">There are no views yet.</p>

  <div class="table-responsive" th:if="${!rows.isEmpty()}">
    <table class="table align-middle">
      <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Lists</th>
        <th scope="col">Displays</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${rows}" th:attr="data-view=${row.id}">
        <td>
          <span th:text="${row.label}">Content</span>
          <span class="d-block text-body-secondary small" th:text="${row.description}">Find and manage content.</span>
        </td>
        <td th:text="${row.base}">node</td>
        <td th:text="${row.displays}">Content (/admin/content)</td>
        <td>
          <a class="btn btn-secondary btn-sm" th:href="${editPath} + ${row.id}">Edit</a>
          <a class="btn btn-danger btn-sm" th:href="${editPath} + ${row.id} + '/delete'">Delete</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Some required modules must be enabled</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Some required modules must be enabled</h1>
  <p class="modules-confirm">
    <span th:text="${'Enabling ' + #strings.listJoin(enabling, ', ') + ' also enables '
        + #strings.listJoin(alsoNeeded, ', ') + ', which it needs.'}">Enabling Widgets also enables Foundation, which it
      needs.</span>
  </p>
  <form method="post" th:action="${action}">
    <input type="hidden" name="modules" th:value="${modules}">
    <input type="hidden" name="disabling" th:value="${disabling}">
    <button type="submit" class="btn btn-primary">Continue</button>
    <a class="btn btn-secondary" th:href="${cancelPath}">Cancel</a>
  </form>
</main>
</body>
</html>

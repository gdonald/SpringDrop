<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Translations</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Translations of Summary</h1>
  <p th:if="${languages.isEmpty()}" class="no-languages">Add a language other than English to translate into.</p>
  <table class="table align-middle config-languages" th:if="${!languages.isEmpty()}">
    <thead>
    <tr>
      <th scope="col">Language</th>
      <th scope="col">Status</th>
      <th scope="col">Operations</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="row : ${languages}" th:attr="data-language=${row.language.id}">
      <td th:text="${row.language.label}">French</td>
      <td th:text="${row.translated ? 'Translated' : 'Not translated'}">Translated</td>
      <td><a class="btn btn-secondary btn-sm" th:href="${translatePath} + ${row.language.id}"
             th:text="${row.translated ? 'Edit' : 'Add'}">Edit</a></td>
    </tr>
    </tbody>
  </table>
</main>
</body>
</html>

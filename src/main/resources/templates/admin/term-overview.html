<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Tags</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/toolbar :: toolbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>
<div th:replace="~{fragments/help :: help}"></div>
<main class="container py-5">
  <h1 class="h3" th:text="${title}">Tags</h1>
  <th:block th:replace="~{fragments/actions :: localTasks(${localTasks})}"></th:block>
  <p class="text-body-secondary" th:text="${description}"></p>

  <th:block th:replace="~{fragments/actions :: localAction('Add term', ${addPath})}"></th:block>

  <th:block th:if="${rows.isEmpty()}"><th:block th:replace="~{fragments/actions :: empty('This vocabulary has no terms yet.')}"></th:block></th:block>

  <form method="post" th:action="${action}" th:if="${!rows.isEmpty()}">
    <div class="table-responsive">
      <table class="table align-middle admin-listing" data-drag-order="terms">
        <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Parent</th>
          <th scope="col">Weight</th>
          <th scope="col">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${rows}" data-drag-handle="true" draggable="true"
            th:attr="data-term=${row.id},data-depth=${row.depth}">
          <td>
            <span class="text-body-secondary" th:if="${row.depth > 0}"
                  th:text="${#strings.repeat('-', row.depth)}">-</span>
            <a th:href="'/taxonomy/term/' + ${row.id}" th:text="${row.name}">Europe</a>
          </td>
          <td>
            <select class="form-select form-select-sm" th:name="${parentPrefix} + ${row.id}">
              <option th:each="option : ${row.parents}" th:value="${option.value}"
                      th:selected="${option.value == '' + row.parent}" th:text="${option.label}">&lt;root&gt;</option>
            </select>
          </td>
          <td>
            <input type="number" class="form-control form-control-sm" step="1" required
                   th:name="${weightPrefix} + ${row.id}" th:value="${row.weight}" data-drag-weight>
          </td>
          <td>
            <a th:replace="~{fragments/actions :: edit('/taxonomy/term/' + ${row.id} + '/edit')}"></a>
            <a th:replace="~{fragments/actions :: delete('/taxonomy/term/' + ${row.id} + '/delete')}"></a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <button type="submit" class="btn btn-primary">Save terms</button>
  </form>
</main>
<script type="module" th:attr="nonce=${cspNonce}" th:inline="javascript">
  import { initDragOrder } from [[${@assets.url('/js/drag-order.js')}]];
  initDragOrder();
</script>
</body>
</html>

spring:
  application:
    name: springdrop
  config:
    # The build names the fingerprinted script bundle here.
    import: optional:classpath:springdrop/assets.properties
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration/core
  servlet:
    multipart:
      # The largest upload the site takes. A file or image field can set a lower limit.
      max-file-size: 32MB
      max-request-size: 32MB
springdrop:
  theme:
    default: front-end
management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # An unreachable mail server does not make the site unhealthy: pages still
    # render and content still saves, so mail stays out of the health rollup.
    mail:
      enabled: false

spring:
  application:
    name: springdrop
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration/core
springdrop:
  theme:
    default: front-end
management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # An unreachable mail server does not make the site unhealthy: pages still
    # render and content still saves, so mail stays out of the health rollup.
    mail:
      enabled: false
